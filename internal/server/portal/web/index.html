<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设计云平台</title>
  <link rel="icon" type="image/x-icon" href="static/assets/design-cloud.ico?v=__WEB_VERSION__">
  <script src="static/js/theme.js?v=__WEB_VERSION__"></script>
  <link rel="stylesheet" href="static/css/theme.css?v=__WEB_VERSION__">
  <link rel="stylesheet" href="static/css/index.css?v=__WEB_VERSION__">
</head>

<body>

  <!-- 顶部 Navigation -->
  <nav>
    <div class="nav-inner">
      <div class="brand">
        <img class="logo" src="static/assets/design-cloud-logo.svg?v=__WEB_VERSION__" alt="设计云平台" />
        设计云平台
      </div>
      <div class="nav-links">
        <a href="#download">下载客户端</a>
        <a class="btn-action" href="/overview">进入数据大屏 ↗</a>
        <button class="theme-toggle-btn" id="themeToggle" title="切换亮/暗主题">🌙</button>
      </div>
    </div>
  </nav>

  <div class="page">

    <!-- Hero 区块 -->
    <section class="hero">
      <h1>高性能计算管理平台</h1>
      <p class="subtitle">
        统一管理集群多节点，提供便捷的远程桌面管理和访问、资源监控、作业管理、文件管理和许可监控等。
      </p>
      <div class="meta" id="heroMeta">
        <span>引擎版本 <code id="engineVersion">unknown</code></span>
        <span class="meta-sep">|</span>
        <span>提交 <code id="engineCommit">unknown</code></span>
        <span class="meta-sep">|</span>
        <span>发布日期 <code id="engineDate">unknown</code></span>
      </div>
    </section>

    <!-- 特性卡片 4 大项 -->
    <section class="features" id="features">
      <div class="glass-panel feat-card">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-cyan)" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="4" />
            <path d="M6 12h12M12 6v12" />
          </svg>
        </div>
        <h3>统一调度</h3>
        <p>多节点统一管理，可视化队列调度与管控。</p>
      </div>

      <div class="glass-panel feat-card">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <h3>用户隔离</h3>
        <p>权限体系，租户与会话文件隔离，审计全程可溯源。</p>
      </div>

      <div class="glass-panel feat-card">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-emerald)" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
        </div>
        <h3>资源监控</h3>
        <p>节点健康状态监控，负载预警与运行态势一屏掌握。</p>
      </div>

      <div class="glass-panel feat-card">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-violet)" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
        </div>
        <h3>远程连接</h3>
        <p>多节点多协议连接统一管理，一键快速连接。</p>
      </div>
    </section>

    <!-- 下载区块 -->
    <section class="download-section" id="download">
      <div class="section-head">
        <h2>客户端下载</h2>
        <div class="release-meta" id="dlReleaseMeta" hidden>
          <span class="platform-chip">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z" />
            </svg>
            Windows
          </span>
          <span class="version-chip" id="dlVersionChip" hidden></span>
        </div>
      </div>

      <div class="glass-panel dl-panel">
        <div id="downloadContent"></div>
      </div>
    </section>
  </div>

  <footer>
    <div>© 2026 设计云平台 · Design Cloud Engine</div>
  </footer>

  <script src="static/js/portal-dom.js?v=__WEB_VERSION__"></script>
  <script src="static/js/index.js?v=__WEB_VERSION__"></script>
</body>

</html>
