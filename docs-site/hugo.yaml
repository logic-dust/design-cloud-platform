baseURL: /
title: Design Cloud Engine

locale: zh-cn
defaultContentLanguage: zh-cn
enableRobotsTXT: true
disableKinds:
  - taxonomy
  - term

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    - source: docs
      target: content/docs
    - source: static
      target: static

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true
    guessSyntax: true

menu:
  main:
    - name: 文档
      pageRef: /docs
      weight: 10
    - name: 搜索
      weight: 15
      params:
        type: search
    - name: 概述
      pageRef: /docs/overview
      weight: 20
    - name: 开发
      pageRef: /docs/development
      weight: 30
    - name: 部署
      pageRef: /docs/deployment
      weight: 40
    - name: Portal API
      pageRef: /docs/api
      weight: 50
    - name: 主题
      weight: 60
      params:
        type: theme-toggle
        label: true

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      height: 40
      link: /
    width: wide
  footer:
    displayCopyright: false
    displayPoweredBy: true
    width: wide
  editURL:
    enable: false
  page:
    width: wide
    displayPagination: false
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
