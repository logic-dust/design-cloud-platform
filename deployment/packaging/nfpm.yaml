name: "design-cloud-engine"
arch: "${PKG_ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${PKG_RELEASE}"
section: "default"
priority: "extra"
maintainer: "Design Cloud Team <team@example.com>"
description: |
  Design Cloud Engine — HPC desktop management engine and dc-exec.
  Engine and dc-exec are version-locked in this single package.
vendor: "Design Cloud"
homepage: "https://github.com/levinit/design-cloud-engine"
license: "Proprietary"

contents:
  - dst: "/opt/dce"
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: "${ENGINE_ABS_PATH}"
    dst: "/opt/dce/dc-engine"
    file_info:
      mode: 0755
      owner: "${PKG_USER}"
      group: "${PKG_GROUP}"

  - src: "${EXEC_BIN_ABS_PATH}"
    dst: "/opt/dce/dc-exec"
    file_info:
      mode: 0700
      owner: "${PKG_USER}"
      group: "${PKG_GROUP}"

  - dst: "/etc/design-cloud"
    type: dir
    file_info:
      mode: 0750
      owner: "${PKG_USER}"
      group: "${PKG_GROUP}"

  - src: "${CONFIG_ABS_PATH}"
    dst: "/etc/design-cloud/config.toml"
    type: config|noreplace
    file_info:
      mode: 0600
      owner: "${PKG_USER}"
      group: "${PKG_GROUP}"

  - dst: "/var/lib/design-cloud"
    type: dir
    file_info:
      mode: 0700
      owner: "${PKG_USER}"
      group: "${PKG_GROUP}"

  - dst: "/var/log/design-cloud"
    type: dir
    file_info:
      mode: 0750
      owner: "${PKG_USER}"
      group: "${PKG_GROUP}"

  - src: "${UNIT_ABS_PATH}"
    dst: "/usr/lib/systemd/system/design-cloud-engine.service"
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: "${TMPFILES_ABS_PATH}"
    dst: "/usr/lib/tmpfiles.d/design-cloud-engine.conf"
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: "${CONFIGLESS_EXAMPLE_ABS_PATH}"
    dst: "/usr/share/doc/design-cloud-engine/systemd/configless.conf.example"
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: "${VNC_WRAPPER_ABS_PATH}"
    dst: "/usr/share/design-cloud-engine/scripts/vnc/job-gui-wrapper.sh"
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: "${LOGROTATE_ABS_PATH}"
    dst: "/etc/logrotate.d/design-cloud-engine"
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall: "${PRE_INSTALL_SCRIPT}"
  postinstall: "${POST_INSTALL_SCRIPT}"
  preremove: "${PRE_REMOVE_SCRIPT}"

# RPM-only scriptlets live under the rpm section (RPMScripts: pretrans/posttrans/verify).
# Putting posttrans under the generic scripts block fails the nFPM schema:
# "field posttrans not found in type nfpm.Scripts".
rpm:
  scripts:
    posttrans: "${POST_TRANS_SCRIPT}"

overrides:
  rpm:
    depends:
      - libcap
      - shadow-utils
  deb:
    depends:
      - libcap2-bin
      - passwd
